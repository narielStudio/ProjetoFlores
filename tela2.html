                        <div class="option-card" data-flowers="campo" onclick="toggleFlower(this)">

                    </div>

                    </div>
                

                    <div class="option-card" data-flowers="branca" onclick="toggleFlower(this)">

                    </div>


                    <div class="option-card" data-flowers="lirio" onclick="toggleFlower(this)">
